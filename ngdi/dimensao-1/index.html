                        <li><strong>Definição das Competências:</strong> Devem estar definidas no PPC, de acordo com as DCNs/CNCST/normativas, ser coerentes com o perfil esperado do egresso, e ser compostas pelos conhecimentos, habilidades e atitudes que o egresso deve ter ao concluir o curso.</li>
                        <li><strong>Revisão Periódica:</strong> São periodicamente revisadas e atualizadas (além do cumprimento básico das DCNs/CNCST), com apoio de representantes externos à IES, do ambiente de atuação profissional.</li>
                        <li><strong>Uso de Tecnologias:</strong> As competências são desenvolvidas utilizando-se da integração com tecnologias educacionais digitais, considerando-se sua materialização/reflexo na estrutura, nos componentes e nos conteúdos curriculares.</li>
                        <li><strong>Função da Revisão:</strong> A revisão ocorre em função das avaliações internas e externas, visando atualizações curriculares, aprimoramento do processo formativo e melhorias da organização de espaço pedagógico, para o aperfeiçoamento contínuo.</li>

                `
            },
            "O1_13": {
                title: "1.13 Acompanhamento de egressos",
                details: `
                    <ul>
                        <li><strong>Ações de Acompanhamento:</strong> Devem estar de acordo com as DCNs/CNCST/normativa vigente, incluir coleta regular e sistemática de informações (empregabilidade, remuneração, satisfação profissional), incluir métricas quantitativas e qualitativas e incluir estímulo para o engajamento dos egressos.</li>
                        <li><strong>Monitoramento do Mercado:</strong> Devem produzir relatório periódico com diagnósticos sobre o desempenho dos egressos junto a empregadores, contemplar a oferta de formação continuada ou de especialização e subsidiar (com base no diagnóstico) a proposição de ações de melhoria.</li>
                        <li><strong>Mapeamento:</strong> Devem possibilitar o mapeamento de trajetórias ocupacionais típicas, do tempo médio de colocação no mercado de trabalho e das competências/características de perfil associadas à inserção/adaptação/progressão profissional.</li>
                        <li><strong>Integração de Tecnologias:</strong> Devem incluir o uso de tecnologias de análise de dados e inteligência artificial para obter compreensão do progresso/impacto dos egressos, análise preditiva e modelagem de trajetória de carreira.</li>
                        <li><strong>Retroalimentação Curricular:</strong> Incluem a integração das devolutivas dos egressos no aprimoramento do curso em todas as suas fases, desde o desenho do currículo.</li>

            },
            "O1_14": {
                title: "1.14 Ações de internacionalização acadêmica no âmbito do curso",
                details: `
                    <p>(Obrigatório apenas para cursos que contemplam ações de internacionalização no PPC ou nas DCNs).</p>
                    <ul>
                        <li><strong>Previsão e Coordenação:</strong> As ações devem estar previstas no PDI e efetivarem-se no PPC, e possuir coordenação, setor ou responsável designado formalmente.</li>
                        <li><strong>Incluem:</strong> Atividades de aprendizagem em colaboração com IES estrangeiras, eventos/palestras com atores internacionais, monitoramento e avaliação de resultados, programas de mobilidade (estudantil e/ou pesquisa colaborativa) e estímulo à promoção da interculturalidade e do combate à xenofobia.</li>
                        <li><strong>Fomento e Acolhimento:</strong> Fomentam a mobilidade docente (para ministrar ou fazer cursos no exterior) e executam programa de acolhimento a estudantes, docentes e pesquisadores internacionais.</li>
                        <li><strong>Colaboração de Docentes Estrangeiros:</strong> As ações estabelecem-se na implementação de projetos com a colaboração de docentes estrangeiros para o desenvolvimento, disseminação e transferência de inteligência, tecnologia e conhecimento.</li>
                    </ul>

        };

        /**
         * Função para exibir os detalhes de um nó do diagrama.
         * Esta função é anexada ao 'window' para ser acessível pelo Mermaid.
         * @param {string} id O ID do nó clicado (ex: "O1_1")
         */
        window.showDetails = function(id) {
            const detailsBox = document.getElementById('details-box');
            const data = explanations[id];

            if (data) {
                detailsBox.innerHTML = `<h2>${data.title}</h2>${data.details}`;
            } else {
                detailsBox.innerHTML = `<h2>Erro</h2><p>Detalhes não encontrados para o item ${id}.</p>`;
            }
        };

        /**
         * Função para renderizar o gráfico D3.js
         */
        function renderD3Chart() {
            // 1. Transformar os dados do 'explanations' para a hierarquia do D3
            const rootData = {
                name: "Dimensão 1",
                id: "D1",
                children: []
            };

            for (const key in explanations) {
                if (key !== "D1") {
                    rootData.children.push({
                        name: explanations[key].title,
                        id: key
                    });
                }
            }

            // 2. Configurações do D3
            const container = document.getElementById('d3-container');
            const width = container.clientWidth;
            const height = 600; // Altura fixa para melhor distribuição vertical
            const margin = {top: 20, right: 180, bottom: 20, left: 120}; // Margens para o texto
            
            const treeWidth = width - margin.left - margin.right;
            const treeHeight = height - margin.top - margin.bottom;


            const svg = d3.select("#d3-svg")
                .attr("viewBox", [0, 0, width, height])
                .style("width", "100%")
                .style("height", "auto");
            
            // Limpa o SVG anterior para redesenhar
            svg.selectAll("*").remove();

            const g = svg.append("g")
                .attr("transform", `translate(${margin.left}, ${margin.top})`);

            // 3. Criar o Layout de Árvore Horizontal
            const tree = d3.tree()
                .size([treeHeight, treeWidth]); // [altura, largura]

            const root = tree(d3.hierarchy(rootData));

            // 4. Desenhar os Links (Linhas)
            const link = g.append("g")
                .attr("class", "links")
                .selectAll("path")
                .data(root.links())
                .join("path")
                .attr("class", "link")
                .attr("d", d3.linkHorizontal()
                    .x(d => d.y) // Invertido: y é a posição horizontal
                    .y(d => d.x) // Invertido: x é a posição vertical
                );

            // 5. Desenhar os Nós (Círculos e Texto)
            const node = g.append("g")
                .attr("class", "nodes")
                .selectAll("g")
                .data(root.descendants())
                .join("g")
                .attr("class", d => d.depth === 0 ? "node node--root" : "node node--leaf")
                .attr("transform", d => `translate(${d.y}, ${d.x})`) // Invertido (y, x)
                .on("click", (event, d) => {
                    window.showDetails(d.data.id);
                });
            
            // Adiciona o tooltip (hint)
            node.append("title")
                .text(d => `Clique para ver detalhes: "${d.data.name}"`);

            node.append("circle")
                .attr("r", d => d.depth === 0 ? 10 : 7);

            node.append("text")
                .attr("dy", "0.31em")
                .attr("x", d => d.children ? -14 : 14) // Posição do texto (antes ou depois do círculo)
                .attr("text-anchor", d => d.children ? "end" : "start") // Alinhamento do texto
                .text(d => d.data.name)
                .clone(true).lower()
                .attr("stroke", "white")
                .attr("stroke-width", 3);
            
            // Não é mais necessário centralizar o texto da raiz
        }


        // Inicializa
        document.addEventListener('DOMContentLoaded', (event) => {
            // Exibe os detalhes iniciais da Dimensão 1
            window.showDetails('D1');
            
            // Renderiza o gráfico D3
            renderD3Chart();

            // Recria o gráfico se a janela for redimensionada (para responsividade)
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(renderD3Chart, 250);
            });
        });
    </script>
